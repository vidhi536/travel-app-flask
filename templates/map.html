<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PlanNGo – Map</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
}

#map{
height:100vh;
width:100%;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

let map;
let directionsService;
let directionsRenderer;

const params = new URLSearchParams(window.location.search);
const destination = params.get("destination") || "Mumbai";

const savedPlaces = JSON.parse(localStorage.getItem("tripPlaces")) || [];

function initMap(){

map = new google.maps.Map(document.getElementById("map"),{
zoom:12,
center:{lat:18.5204,lng:73.8567}
});

directionsService = new google.maps.DirectionsService();

directionsRenderer = new google.maps.DirectionsRenderer({
map:map
});

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(position=>{

const start={
lat:position.coords.latitude,
lng:position.coords.longitude
};

new google.maps.Marker({
position:start,
map:map,
title:"Start",
icon:"http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
});

showPlaces();

drawRoute(start);

});

}

}

function showPlaces(){

savedPlaces.forEach(place=>{

new google.maps.Marker({
map:map,
position:{lat:place.lat,lng:place.lng},
title:place.name
});

});

}

function drawRoute(start){

if(savedPlaces.length === 0) return;

const waypoints = savedPlaces.slice(0,-1).map(place=>({
location:{lat:place.lat,lng:place.lng},
stopover:true
}));

const end = {
lat: savedPlaces[savedPlaces.length-1].lat,
lng: savedPlaces[savedPlaces.length-1].lng
};

directionsService.route({

origin:start,
destination:end,
waypoints:waypoints,
travelMode:google.maps.TravelMode.DRIVING

},(result,status)=>{

if(status==="OK"){

directionsRenderer.setDirections(result);

}

});

}

</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCkIPEHU60BvEC3d598gpel5L9wT0lfai0&callback=initMap">
</script>

</body>
</html>
